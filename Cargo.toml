[package]
name = "watermark-remover"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "tester"
path = "src/bin/tester.rs"

[dependencies]
anyhow    = "1"
axum      = { version = "=0.7.9", features = ["multipart"] }
bytes     = "1"
moka      = { version = "0.12", features = ["sync"] }
num_cpus  = "1"
once_cell = "1"
opencv    = { version = "0.94", default-features = false, features = ["clang-runtime", "imgcodecs", "imgproc", "photo"] }
reqwest   = { version = "=0.12.9", default-features = false, features = ["rustls-tls"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
tokio     = { version = "1", features = ["full"] }
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level      = 3
lto            = "thin"
codegen-units  = 1
strip          = true
